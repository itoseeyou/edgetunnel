
name: Sync Upstream

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.FORK_SYNC_TOKEN }}

      - name: Merge upstream main
        env:
          GH_TOKEN: ${{ secrets.FORK_SYNC_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          REPO="$GITHUB_REPOSITORY"
          UPSTREAM="cmliu/edgetunnel"

          echo "Fork: $REPO"
          echo "Upstream: $UPSTREAM"

          # Fetch upstream
          git remote add upstream \
            "https://github.com/${UPSTREAM}.git"

          git fetch upstream main

          # Check whether already synchronized
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          # Merge upstream changes
          git merge --no-edit upstream/main

          # Push changes to fork
          git push origin HEAD:main

          echo "Upstream merge and push completed."
